<!DOCTYPE html>
<!-- Enquiry page: custom cake order form -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiry | Ntsiki's Artisan Bakehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
      <a class="logo" href="index.html">Ntsiki's Artisan Bakehouse</a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="enquiry.html">Enquiry</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-intro">
        <h1>Enquiries &amp; Custom Orders</h1>
        <p>Planning a celebration? Tell us what you need and we'll get back to you.</p>
      </section>

      <form class="enquiry-form" action="#" method="post">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="occasion">Occasion</label>
        <input type="text" id="occasion" name="occasion" placeholder="e.g. Birthday, Wedding">

        <label for="date">Date Needed</label>
        <input type="date" id="date" name="date">

        <label for="message">Tell us more</label>
        <textarea id="message" name="message" rows="5" placeholder="Flavour, size, number of guests..."></textarea>

        <button type="submit" class="btn">Send Enquiry</button>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 Ntsiki's Artisan Bakehouse. All rights reserved.</p>
      <p>123 Baker Street, Johannesburg | 011 000 0000</p>
    </footer>

  <script src="js/main.js"></script>
</body>
</html>
